[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pii-mask"
version = "0.1.0"
description = "Take Brazilian personal data out of a prompt and put it back: CPF, CNPJ, card, phone and email, confirmed by check digits."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rafael Penco de Carvalho", email = "102534725+Rafaelcarvalho320@users.noreply.github.com" }]
keywords = ["pii", "lgpd", "cpf", "cnpj", "redaction", "llm", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/Rafaelcarvalho320/pii-mask"
Issues = "https://github.com/Rafaelcarvalho320/pii-mask/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_mask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
# The area-code table is laid out by region, one line per range of DDDs, and
# the formatter would reflow it into an unreadable block.
exclude = ["src/pii_mask/validators.py"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "examples"]
